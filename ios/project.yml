name: SAI
options:
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '26'
packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    from: 3.4.0
targets:
  SAI:
    type: application
    platform: iOS
    sources: [SAI, Shared]
    dependencies:
      - target: SAIWatch
        embed: true
      - package: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.sai.mobile
        INFOPLIST_FILE: SAI/Info.plist
        CODE_SIGN_ENTITLEMENTS: SAI/SAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Remove extended attributes
        script: 'xattr -cr "$TARGET_BUILD_DIR/$WRAPPER_NAME"'
        basedOnDependencyAnalysis: false
  SAIWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - SAIWatch
      - Shared
      - path: SAI/NativePlaybackLedger.swift
      - path: SAI/NativeMicrophoneQueue.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.sai.mobile.watchkitapp
        INFOPLIST_FILE: SAIWatch/Info.plist
        TARGETED_DEVICE_FAMILY: '4'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Sync canonical SAI orb
        script: '/opt/homebrew/bin/node "$SRCROOT/../mac/sync-watch-orb.mjs" --check'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Remove extended attributes
        script: 'xattr -cr "$TARGET_BUILD_DIR/$WRAPPER_NAME"'
        basedOnDependencyAnalysis: false
  SAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SAIUITests]
    dependencies:
      - target: SAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.sai.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SAI
schemes:
  SAI:
    build:
      targets:
        SAI: all
        SAIUITests: [test]
    test:
      targets: [SAIUITests]
  SAIWatch:
    build:
      targets:
        SAIWatch: all
